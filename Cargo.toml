[package]
name = "zsh-patina"
version = "1.11.0"
edition = "2024"
authors = ["Michel Krämer <michel@undercouch.de>"]
license = "MIT"
description = "$ A blazingly fast Zsh plugin performing syntax highlighting of your command line while you type 🌈"
readme = "README.md"
homepage = "https://github.com/michel-kraemer/zsh-patina"
repository = "https://github.com/michel-kraemer/zsh-patina"
keywords = ["shell", "zsh", "syntax", "highlighting", "syntax-highlighting"]
categories = ["command-line-utilities"]
rust-version = "1.89"

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev.package.insta]
opt-level = 3

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
close_fds = "0.3.2"
dirs = "7.0.0"
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"]}
figment = { version = "0.10.19", features = ["toml"] }
libc = "0.2.190"
log = "0.4.34"
rayon = "1.12.0"
regex-syntax = { version = "0.8.11", default-features = false }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
shellexpand = "3.1.2"
strum = { version = "0.28.0", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
tempfile = "3.27.0"
termcolor = "1.4.1"
textwrap = { version = "0.16.4", features = ["terminal_size"] }
toml = "1.1.7"

[build-dependencies]
anyhow = "1.0.104"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "yaml-load"] }

[dev-dependencies]
insta = "1.49.0"
pretty_assertions = "1.4.1"
tabwriter = "1.4.1"
testcontainers = "0.28.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
